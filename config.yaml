name: Tuya DP Listener
version: "0.1.0"
slug: tuya_dp_listener
description: Local Tuya Wi-Fi DP monitor with MQTT Discovery for Home Assistant
url: https://example.invalid/tuya-dp-listener
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
host_network: true
options:
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  discovery_prefix: homeassistant
  poll_interval: 5
  devices: []
schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  discovery_prefix: str
  poll_interval: int(1,300)
  devices:
    - name: str
      device_id: str
      ip: str
      local_key: password
      protocol_version: str
      datapoints:
        - dp_id: str
          name: str
          component: list(binary_sensor|sensor)
          device_class: str?
          unit_of_measurement: str?
          value_on: str?
          value_off: str?
